schema_version: libero_interaction_representation_v1
seed: 2057736129
output_dir: outputs/representation_study/libero_smolvla_smoke

sources:
  lerobot_repo_id: lerobot/libero
  lerobot_revision: main
  raw_hdf5_root: data/libero/raw

coverage:
  suites: [libero_spatial, libero_object]
  fail_on_unsupported_task: true
  tasks_per_suite: 3

replay:
  control_freq: 20
  state_l2_p95_tolerance: 0.01
  state_max_abs_tolerance: 0.05
  minimum_acceptance_rate: 0.95
  action_atol: 1.0e-5

annotations:
  stable_window_frames: 5
  relative_translation_drift_m: 0.015
  relative_rotation_drift_deg: 15.0
  minimum_comotion_m: 0.005
  lift_clearance_m: 0.01
  approach_surface_distance_m: 0.05
  hysteresis_m: 0.01
  grasp_aperture_threshold: 0.55
  minimum_finger_groups: 2

state_bank:
  states_per_episode: 16
  holdout_episodes_per_task: 3
  timeline_count: 4

splits:
  seed: 2057736129
  task_ratios: [0.7, 0.15, 0.15]
  episode_ratios: [0.7, 0.15, 0.15]

stages:
  base_model: lerobot/smolvla_base
  base_revision: main
  fractions: [0.25, 0.50, 1.0]
  epochs: 1
  seed: 2057736129
  batch_size: 2
  num_workers: 2

taps:
  names: [vision_output, multimodal_fusion, action_expert_input, pre_action]
  pooling: valid_token_mean
  denoising_call: final

probes:
  bootstrap_samples: 200
  confidence_level: 0.95
  linear_l2: [0.0, 0.0001, 0.001]
  mlp_hidden_dim: 128
  linear_epochs: 50
  mlp_epochs: 30
