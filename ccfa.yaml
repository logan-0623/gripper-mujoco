version: "0.6.0"
project:
  title: "Interaction-Centric Representation Dynamics in Vision-Language-Action Policies"
  short_name: "libero-vla-interaction-representation"
  root: "."
target_venue:
  name: "ICRA"
  year: "2027"
  mode: "review"
stage:
  current: "libero_state_bank_implementation_ready"
  gate: "linux_libero_source_alignment_and_replay_pending"
  updated_at: "2026-08-23"

artifacts:
  scientific_audit: "docs/research/2026-08-23-libero-vla-representation-audit.md"
  design: "docs/superpowers/specs/2026-08-23-libero-interaction-representation-design.md"
  implementation_plan: "docs/superpowers/plans/2026-08-23-libero-interaction-representation.md"
  experiments: "outputs/representation_study/"
  legacy_act: "outputs/graph_control/graph_v2_pilot/"
  libero_main: "outputs/representation_study/libero_smolvla/"

scientific_contract:
  primary_question: "What physically grounded interaction information exists before manipulation SFT, what is selectively acquired or reorganized during SFT, where does it become action-proximal, and which factors are accessible, functionally used, or useful in closed loop?"
  analysis_axes:
    stages: [pretrained, sft_25, sft_50, sft_100]
    taps: [vision_output, multimodal_fusion, action_expert_input, pre_action]
    factors: [entity, geometry, contact, stable_grasp, phase, next_relation]
  measurement_levels: [accessible, functionally_used, closed_loop_useful]
  graph_role: "privileged annotation and measurement vocabulary; not a required policy architecture"
  prohibited_implications:
    - "accessible does not imply functionally used"
    - "functionally used does not imply closed-loop useful"
  rl_scope: "conditional_future_work"

claims:
  - id: C1
    text: "Manipulation SFT may selectively gain, preserve, weaken, or reorganize physically grounded interaction factors across the VLA computation path."
    status: hypothesis
    required_evidence: "complete Stage × Tap × Factor grid on one shared LIBERO State Bank"
  - id: C2
    text: "Accessibility, factor-aligned action sensitivity, and closed-loop utility must be measured separately for the same interaction factor."
    status: measurement_principle
  - id: C3
    text: "A physically grounded interaction vocabulary can be used to study representations without requiring graph-conditioned policy inputs."
    status: design_principle
  - id: C4
    text: "RL may selectively reorganize recovery-critical factors after SFT."
    status: conditional_hypothesis
    blocked_by:
      - "validated offline representation study"
      - "interpretable closed-loop interventions"
      - "non-saturated perturbation distribution"
      - "positive Oracle-State residual recovery gate"

experiment_registry:
  - id: ACT_GRAPH_V2
    name: "Graph-v2 ACT multi-seed controlled study"
    status: formal_evidence
    role: controlled_mechanism_evidence
    immutable: true
    evidence:
      flat_success: 0.3000
      teacher_graph_success: 0.3500
      predicted_random_success: 0.4000
      predicted_reflect_success: 0.4167
      policy_seeds: 3
      rollouts_per_condition: 60
    limitation: "Does not establish modern-VLA representation dynamics."
  - id: ACT_GRAPH_DIAGNOSTICS
    name: "Graph-v2 diagnostics and intervention controls"
    status: pilot_complete
    role: mechanism_motivation
    limitation: "Offline action sensitivity is not closed-loop utility."
  - id: REFLECT_GRAPH_PRETRAIN
    name: "ReflectVLM semantic Graph pretraining"
    status: pilot_complete
    role: secondary_transfer_observation
    finding: "Closer teacher-graph prediction did not reliably improve ACT success over random estimator initialization."
  - id: ACT_STAGEWISE
    name: "ACT stagewise representation study"
    status: pilot_complete
    role: controlled_mechanism_pilot
    limitation: "Small rollout protocol and recovery/backend confounds prevent a formal RL representation claim."
  - id: RECOVERY_RL_V2_CALIBRATION
    name: "Recovery RL v2 distribution calibration"
    status: failed_gate
    role: preserved_negative_calibration
    finding: "No severity placed frozen-SFT recovery success in the preregistered 0.30–0.50 band."
  - id: FORMAL_RECOVERY_RL
    name: "Formal PPO/SAC recovery protocol"
    status: implementation_only
    role: conditional_future_extension
  - id: LIBERO_STATE_BANK
    name: "Shared deterministic LIBERO interaction State Bank"
    status: implementation_only
    role: blocking_main-study_infrastructure
    next_gate: "execute source alignment, replay, annotation, distribution audit, and timeline review on Linux"
  - id: SMOLVLA_LONGITUDINAL
    name: "SmolVLA pretrained/SFT25/SFT50/SFT100 longitudinal study"
    status: not_started
    role: main_modern_vla_evidence
  - id: SMOLVLA_FACTOR_INTERVENTION
    name: "Factor-aligned SmolVLA action and closed-loop intervention"
    status: implementation_only
    role: main_functional_evidence
    blocked_by: "validated probe report"
  - id: SECOND_VLA_REPLICATION
    name: "Targeted second-VLA replication"
    status: not_started
    role: optional_external_validity

dependency_graph:
  - id: P0_A
    name: "repository and CCFA scientific audit"
    status: formal_evidence
    artifact: "docs/research/2026-08-23-libero-vla-representation-audit.md"
    requires: []
  - id: P0_B
    name: "LIBERO source alignment and deterministic replay"
    status: implementation_only
    requires: [P0_A]
    gate: "raw HDF5 + immutable LeRobot revision + replay tolerances"
  - id: P0_C
    name: "privileged interaction annotation"
    status: implementation_only
    requires: [P0_B]
    gate: "finite geometry + temporal contact/stable-grasp/phase/next-relation audit"
  - id: P0_D
    name: "shared State Bank and group splits"
    status: implementation_only
    requires: [P0_C]
    gate: "audit report + task leakage test + episode leakage test + video-backed timelines + explicit manual timeline approval"
  - id: P0_E
    name: "nested SmolVLA stage manifests and fixed semantic taps"
    status: implementation_only
    requires: [P0_D]
    gate: "D25 subset D50 subset D100; checkpoint identity and tensor contract"
  - id: P0_F
    name: "shared-state latent cache"
    status: implementation_only
    requires: [P0_E]
    gate: "exact state-id coverage and immutable checkpoint/state-bank hashes"
  - id: P1_A
    name: "linear probes, baselines, and group-bootstrap intervals"
    status: implementation_only
    requires: [P0_F]
  - id: P1_B
    name: "shallow-MLP capacity check"
    status: implementation_only
    requires: [P1_A]
  - id: P1_C
    name: "Stage × Tap × Factor report"
    status: not_started
    requires: [P1_A, P1_B]
  - id: P1_D
    name: "factor-aligned intervention execution"
    status: implementation_only
    requires: [P1_C]
  - id: P1_E
    name: "paired closed-loop utility evaluation"
    status: implementation_only
    requires: [P1_D]
  - id: RL_EXTENSION
    name: "online adaptation and RL plasticity"
    status: not_started
    requires: [P1_E]
    execution_allowed: false

execution_constraints:
  preserve_old_outputs: true
  prohibit_frame_random_split: true
  shared_state_bank_across_stages: true
  state_bank_episodes_excluded_from_sft: true
  nested_sft_subsets: true
  missing_experiment_cells: not_run
  nominal_recovery_labels_allowed: false
  implementation_completion_is_not_experiment_completion: true
