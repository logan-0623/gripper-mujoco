version: "0.5.0"
project:
  title: "From Imitation to Improvement: Interaction Structure in Robot Policies"
  short_name: "interaction-representation-study"
  root: "."
target_venue:
  name: "ICRA"
  year: "2027"
  mode: "review"
stage:
  current: "formal_act_recovery_protocol_implemented"
  gate: "formal_act_server_execution_pending"
  updated_at: "2026-08-22"
artifacts:
  manuscript: "docs/paper/icra/main.tex"
  bibliography: "docs/paper/icra/references.bib"
  figures: "outputs/representation_study/figures/"
  tables: "outputs/representation_study/tables/"
  experiments: "outputs/representation_study/"
  reviews: "docs/paper/icra/reviews/"
  submission: "docs/paper/icra/submission/"
claims:
  - id: "C1"
    text: "Reward-driven adaptation may selectively reorganize interaction-critical representations rather than uniformly improving representation quality."
    status: "hypothesis"
    required_evidence:
      - "fixed-state-bank probes across pretrained, SFT, continued-SFT, and RL stages"
      - "stage-matched closed-loop outcomes"
  - id: "C2"
    text: "Representation correctness, behavioral utility, and online plasticity are distinct quantities."
    status: "partially_supported"
    current_evidence: "Reflect-pretrained Graph estimates are closer to the Teacher Graph but do not reliably improve ACT success over random initialization."
    required_evidence:
      - "probe-quality versus BC-success analysis"
      - "probe-change versus RL-learning-AUC analysis"
      - "causal latent or input interventions"
  - id: "C3"
    text: "Interaction structure is a measurement language for policy analysis, not a mandatory policy input."
    status: "design_principle"
experiments:
  - id: "E0"
    name: "legacy_graph_input_study"
    role: "motivation_and_controlled_baseline"
    backend: "ACT"
    status: "complete"
    immutable_schema: true
  - id: "E1"
    name: "measurement_contract_and_statistics"
    role: "measurement_validation"
    backend: "ACT"
    status: "complete"
    gate: "passed_2026-08-20"
    evidence:
      - "graph_policy_sensitivity_v3 with train-split action-IQR scaling and full-token controls"
      - "ACT/SmolVLA/pi0 stage manifest and fixed tap contracts"
      - "726 tests passed, 5 skipped"
  - id: "E2"
    name: "act_stagewise_mechanism_study"
    role: "controlled_mechanism_study"
    backend: "ACT"
    status: "implementation_complete_experiments_pending"
    gate: "three_seed_stagewise_act_evidence"
  - id: "E3"
    name: "smolvla_stagewise_validation"
    role: "modern_vla_validation"
    backend: "SmolVLA"
    status: "implementation_ready_not_run"
    gate: "act_go_no_go_pass"
  - id: "E4"
    name: "pi0_backend_validation"
    role: "optional_external_validity"
    backend: "pi0"
    status: "optional_adapter_ready_not_run"
evidence_log:
  - id: "EV1"
    artifact: "outputs/graph_control/graph_v2_pilot/diagnostics/test/sensitivity_v2/report.json"
    schema_version: "graph_policy_sensitivity_v2"
    status: "valid_descriptive_evidence"
    findings:
      - "Entity presence, relation presence, and gripper-target geometry have the largest ACT masking responses."
      - "Teacher-Graph policies are more sensitive to Graph masking without achieving the best closed-loop success."
      - "Reflect-versus-random sensitivity differences are not consistent across policy seeds."
    limitations:
      - "Twenty sampled observations from five test episodes per seed-condition."
      - "Zero masking can be out of distribution."
      - "Offline action sensitivity does not establish closed-loop usefulness."
    next_gate: "zero_and_temporally_matched_random_controls"
implementation_evidence:
  - id: "IE1"
    artifact: "interaction_vla/graph_control/sensitivity.py"
    status: "verified"
    details:
      - "Sensitivity v3 adds whole-Graph zero and temporally matched random controls."
      - "Compatible v2 records are reused only after dataset, split, cache, and checkpoint validation."
  - id: "IE2"
    artifact: "interaction_vla/representation_study/state_bank/"
    status: "populated_and_verified"
    details:
      - "Immutable record, manifest, canonical payload, and split schemas."
      - "Source-episode leakage and duplicate observation references are rejected."
      - "664 states: 350 expert-support and 314 policy-shift; 530/69/65 train/validation/test."
      - "Mac and Linux runtime profiles validate against the same State Bank contract."
  - id: "IE3"
    artifact: "interaction_vla/representation_study/probes/"
    status: "verified"
    details:
      - "Frozen linear and shallow-MLP probes cover entity, geometry, contact, stable grasp, phase, next relation, and recovery state."
      - "Reports include held-out domain/stratum metrics, calibration, constant-label controls, sample counts, and episode-group counts."
  - id: "IE4"
    artifact: "interaction_vla/representation_study/interventions.py"
    status: "verified"
    details:
      - "Offline zero, matched-random, and matched-batch-mean interventions measure action displacement."
      - "Paired closed-loop zero interventions report bootstrap intervals, sign-flip tests, and BH adjustment."
      - "Intervention evidence is bound to the stage manifest, linear-probe report, and closed-loop baseline."
  - id: "IE5"
    artifact: "interaction_vla/representation_study/rl/"
    status: "verified_code_experiments_pending"
    details:
      - "SFT and residual PPO have step-zero resume checkpoints, optimizer/RNG provenance, fixed budgets, and progress bars."
      - "RL-head freezes the VLA; RL-representation updates only registered late-fusion parameters."
      - "PPO uses a Jacobian-corrected tanh Gaussian and exact per-transition VLA inference-noise replay."
  - id: "IE6"
    artifact: "interaction_vla/representation_study/backends/lerobot.py"
    status: "verified_code_experiments_pending"
    details:
      - "ACT, SmolVLA, and pi0 expose the same four scientific tap roles."
      - "SmolVLA/pi0 foundation checkpoints are rebound to the local two-camera, 10D-state, 7D-action LeRobotDataset schema."
  - id: "IE7"
    artifact: "interaction_vla/representation_study/report.py"
    status: "verified"
    details:
      - "Machine-readable rows keep accessible, control, used, useful, plasticity, and used-to-useful evidence distinct."
      - "Per-backend reports cannot overwrite each other and descriptive stage correlations are labeled non-causal."
  - id: "IE8"
    artifact: "interaction_vla/representation_study/rl/formal.py"
    status: "verified_code_experiments_pending"
    details:
      - "Five-condition formal ACT protocol separates SFT, continued SFT, Oracle-State, RL-head, and RL-representation."
      - "Three-seed 20,480-step runs use a gated PPO/SAC backend, isolated privileged critics, residual/nominal anchoring, and six immutable snapshots."
      - "State Bank v2 contains 1,200 source-seed-isolated nominal, perturbation, and recovery states with structured next-relation targets."
      - "Formal completeness validates gate chains, semantic manifests, normalization, snapshots, latent/probe coverage, evaluation rows, recomputed aggregates, and artifact hashes."
reviews:
  - id: "R1"
    type: "claim_evidence_audit"
    status: "planned"
